name: Build Home Assistant app image

# Builds the Mealie image for a Home Assistant app, from this fork. It is for the
# deploy branch only. The image goes to GitHub Packages, and a local app on Home
# Assistant pulls it, so the build does not run on the Raspberry Pi.

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cook-progress-v3.30.0
    paths:
      - ha-app/**
      - frontend/**
      - mealie/**
      - .github/workflows/build-ha-app.yml

permissions:
  contents: read
  packages: write

env:
  # Keep this equal to the version in ha-app-local/config.yaml.
  APP_VERSION: "3.30.0-cook.2"
  IMAGE: ghcr.io/${{ github.repository_owner }}/mealie-cooking-aarch64

jobs:
  build:
    name: Build the aarch64 image
    # A native Arm runner, so nothing runs under emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ha-app
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            MEALIE_REPO=${{ github.repository }}
            MEALIE_REF=${{ github.sha }}
            BUILD_FROM=ghcr.io/hassio-addons/debian-base:9.5.2
            BUILD_ARCH=aarch64
            BUILD_NAME=Mealie (Cooking Progress)
            BUILD_DESCRIPTION=Mealie with the Start Cooking and Finish Cooking change
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REF=${{ github.sha }}
            BUILD_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
